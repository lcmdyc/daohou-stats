<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>道猴章名决选</title>
  <style>
    :root {
      --bg-color: #0d0f18;
      --card-bg: #161a29;
      --card-hover: #1f253a;
      --border-color: #27314a;
      --accent: #d4af37;
      --accent-hover: #f1c40f;
      --text-primary: #f8fafc;
      --text-secondary: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
      background-color: var(--bg-color);
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
    }

    .container { width: 100%; max-width: 900px; text-align: center; }
    header { margin-bottom: 1.5rem; }
    h1 { font-size: 2.2rem; color: var(--accent); letter-spacing: 2px; margin-bottom: 0.5rem; }
    .subtitle { color: var(--text-secondary); font-size: 0.95rem; }

    .toolbar {
      margin-bottom: 2rem;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .vol-select {
      background: var(--card-bg);
      color: var(--text-primary);
      border: 1px solid var(--accent);
      padding: 8px 16px;
      border-radius: 6px;
      font-size: 0.95rem;
      outline: none;
      cursor: pointer;
    }
    .vol-select option { background: #11141d; }

    .match-status {
      margin-bottom: 1.5rem;
      font-weight: 600;
      color: var(--accent);
      letter-spacing: 1px;
      font-size: 1.05rem;
      min-height: 1.6em;
    }

    .arena {
      display: flex;
      gap: 24px;
      justify-content: center;
      align-items: stretch;
      position: relative;
      min-height: 220px;
    }

    .vs-badge {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: var(--accent);
      color: #000;
      font-weight: 800;
      font-size: 0.85rem;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 2;
      pointer-events: none;
    }

    .card-option {
      flex: 1;
      background: var(--card-bg);
      border: 2px solid var(--border-color);
      border-radius: 10px;
      padding: 2.5rem 1.5rem;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.3);
    }

    .card-option:hover {
      transform: translateY(-4px);
      border-color: var(--accent);
      background: var(--card-hover);
    }

    .card-title {
      font-size: 1.25rem;
      font-weight: 600;
      line-height: 1.5;
      color: #fff;
    }

    .winner-box {
      display: none;
      background: var(--card-bg);
      border: 2px solid var(--accent);
      border-radius: 12px;
      padding: 2.5rem 2rem;
      animation: fadeIn 0.4s ease;
    }

    .winner-label {
      color: var(--text-secondary);
      font-size: 0.95rem;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .winner-name {
      font-size: 2.2rem;
      color: var(--accent);
      font-weight: 700;
      margin: 1.2rem 0;
    }

    .upload-tip {
      font-size: 0.9rem;
      color: var(--text-secondary);
      margin-bottom: 1rem;
      min-height: 1.5em;
    }

    .btn-group {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-top: 1.5rem;
      flex-wrap: wrap;
    }

    .btn {
      padding: 9px 20px;
      background: var(--accent);
      color: #000;
      font-weight: 600;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.95rem;
      transition: all 0.2s;
    }
    .btn:hover { background: var(--accent-hover); }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }

    .btn-secondary { background: #27314a; color: #f8fafc; }
    .btn-secondary:hover { background: #334155; }

    /* 弹窗 */
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.85);
      z-index: 1000;
      align-items: center;
      justify-content: center;
      padding: 20px;
      backdrop-filter: blur(4px);
    }
    .modal.show { display: flex; }

    .modal-card {
      background: #141824;
      border: 1px solid var(--border-color);
      border-radius: 10px;
      width: 100%;
      max-width: 960px;
      max-height: 85vh;
      display: flex;
      flex-direction: column;
      padding: 24px;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 12px;
      margin-bottom: 16px;
    }

    .modal-header-actions { display: flex; align-items: center; gap: 12px; }
    .modal-title { color: var(--accent); font-size: 1.2rem; font-weight: 600; }

    .btn-export {
      background: var(--accent);
      color: #111;
      font-weight: 600;
      font-size: 0.85rem;
      padding: 5px 14px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }

    .close-btn {
      background: transparent;
      border: none;
      color: var(--text-secondary);
      font-size: 1.6rem;
      cursor: pointer;
      line-height: 1;
    }
    .close-btn:hover { color: #fff; }

    .modal-body { overflow: auto; flex: 1; text-align: left; }

    .tree-container { display: flex; gap: 20px; padding: 10px 4px; min-width: max-content; }
    .tree-round { min-width: 220px; display: flex; flex-direction: column; }
    .tree-round-header {
      font-size: 0.85rem; font-weight: 600; color: var(--text-secondary);
      margin-bottom: 12px; text-align: center; padding-bottom: 6px;
      border-bottom: 1px solid var(--border-color);
    }

    .tree-matches { display: flex; flex-direction: column; justify-content: space-around; flex: 1; gap: 12px; }
    .match-node {
      background: #1a2030; border: 1px solid var(--border-color);
      border-radius: 6px; padding: 8px 10px; display: flex; flex-direction: column; gap: 4px;
    }
    .node-item {
      font-size: 0.85rem; padding: 4px 6px; border-radius: 4px; color: #64748b;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .node-item.winner {
      color: #f8fafc; background: rgba(212, 175, 55, 0.15); font-weight: 600;
      border-left: 3px solid var(--accent);
    }

    .stats-table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
    .stats-table th, .stats-table td { padding: 12px 14px; text-align: left; border-bottom: 1px solid var(--border-color); }
    .stats-table th { color: var(--text-secondary); font-weight: 600; }

    .rank-tag {
      display: inline-block; width: 26px; height: 26px; line-height: 26px;
      text-align: center; border-radius: 50%; font-weight: 700; font-size: 0.85rem;
      background: #27314a; color: #fff;
    }
    .rank-1 { background: #d4af37; color: #000; }
    .rank-2 { background: #94a3b8; color: #000; }
    .rank-3 { background: #b45309; color: #fff; }

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.98); }
      to { opacity: 1; transform: scale(1); }
    }

    @media (max-width: 640px) {
      .arena { flex-direction: column; }
      .vs-badge { display: none; }
    }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1>道猴章名竞赛</h1>
    <p class="subtitle">遵从直觉做出选择，挑选出心目中最无可替代的章节名</p>
  </header>

  <div class="toolbar">
    <label for="vol-select" style="color: var(--text-secondary); font-size: 0.95rem;">决选范围：</label>
    <select id="vol-select" class="vol-select" onchange="onVolChange()">
      <option value="1">第一卷</option>
      <option value="2">第二卷</option>
      <option value="3">第三卷</option>
      <option value="4">第四卷</option>
      <option value="5">第五卷</option>
      <option value="6">第六卷</option>
      <option value="7">第七卷</option>
      <option value="all">全卷大乱斗 (轮次较多)</option>
    </select>
  </div>

  <!-- 对决界面 -->
  <div id="game-view">
    <div class="match-status" id="match-status">正在连接章节数据...</div>
    <div class="arena">
      <div class="vs-badge">VS</div>
      <div class="card-option" onclick="pickWinner(0)">
        <div class="card-title" id="title-a">加载中...</div>
      </div>
      <div class="card-option" onclick="pickWinner(1)">
        <div class="card-title" id="title-b">加载中...</div>
      </div>
    </div>
  </div>

  <!-- 优胜结算界面 -->
  <div id="winner-view" class="winner-box">
    <div class="winner-label">最终裁定章节</div>
    <div class="winner-name" id="final-champion"></div>
    <div class="upload-tip" id="upload-status">已自动汇总决选路径</div>

    <div class="btn-group">
      <button class="btn" onclick="restart()">重新洗牌决选</button>
      <button class="btn btn-secondary" onclick="openTreeModal()">查看晋级路线图</button>
      <button class="btn btn-secondary" onclick="openStatsModal()">全站喜爱度风云榜</button>
      <button class="btn" id="record-btn" onclick="recordToGlobalLeaderboard()">一键计入全站统计</button>
    </div>
  </div>
</div>

<!-- 路线图弹窗 -->
<div class="modal" id="tree-modal" onclick="onModalBgClick(event, 'tree-modal')">
  <div class="modal-card">
    <div class="modal-header">
      <div class="modal-title">决选晋级路线图</div>
      <div class="modal-header-actions">
        <button class="btn-export" onclick="exportTreeAsImage()">导出完整图片</button>
        <button class="close-btn" onclick="closeModal('tree-modal')">&times;</button>
      </div>
    </div>
    <div class="modal-body">
      <div class="tree-container" id="tree-container"></div>
    </div>
  </div>
</div>

<!-- 全站风云榜弹窗 -->
<div class="modal" id="stats-modal" onclick="onModalBgClick(event, 'stats-modal')">
  <div class="modal-card">
    <div class="modal-header">
      <div class="modal-title">道猴全站读者章名喜爱度天梯榜</div>
      <button class="close-btn" onclick="closeModal('stats-modal')">&times;</button>
    </div>
    <div class="modal-body">
      <div id="stats-loading" style="color: var(--text-secondary); padding: 20px 0; text-align: center;">正在同步全站实时票数...</div>
      <table class="stats-table" id="stats-table" style="display: none;">
        <thead>
          <tr>
            <th style="width: 70px;">全站排名</th>
            <th>章节名</th>
            <th style="width: 110px;">读者夺冠票数</th>
          </tr>
        </thead>
        <tbody id="stats-tbody"></tbody>
      </table>
    </div>
  </div>
</div>

<script>
  const NAMESPACE = 'daohou-stats-v1';
  const WIKI_SUBDOMAIN = 'daohou';

  const volPageMap = {
    "1": "Data:卷一章节列表",
    "2": "Data:卷二章节列表",
    "3": "Data:卷三章节列表",
    "4": "Data:卷四章节列表",
    "5": "Data:卷五章节列表",
    "6": "Data:卷六章节列表",
    "7": "Data:卷七章节列表"
  };

  function getApiEndpoint() {
    return `https://${WIKI_SUBDOMAIN}.huijiwiki.com/api.php`;
  }

  let cacheByVol = {};
  let currentRoundCandidates = [];
  let nextRoundWinners = [];
  let currentMatchIndex = 0;
  let roundNumber = 1;
  let finalChampionName = '';
  let tournamentTree = [];
  let roundMatches = [];
  let hasVotedThisGame = false;

  let localLeaderboard = JSON.parse(localStorage.getItem('daohou_local_stats') || '{}');

  async function fetchWikiPage(title) {
    const endpoint = getApiEndpoint();
    const url = `${endpoint}?action=query&prop=revisions&titles=${encodeURIComponent(title)}&rvprop=content&format=json&origin=*&_t=${Date.now()}`;

    try {
      const res = await fetch(url);
      const data = await res.json();
      const pages = data.query?.pages;
      if (!pages) return null;
      const pageId = Object.keys(pages)[0];
      if (pageId === "-1") return null;
      return pages[pageId].revisions[0]['*'];
    } catch (e) {
      console.error(`抓取 ${title} 失败:`, e);
      return null;
    }
  }

  async function getChapters(vol) {
    if (vol === 'all') {
      let all = [];
      for (let i = 1; i <= 7; i++) {
        const part = await getChapters(String(i));
        all = all.concat(part);
      }
      return all;
    }
    if (cacheByVol[vol]) return cacheByVol[vol];

    const raw = await fetchWikiPage(volPageMap[vol]);
    if (raw) {
      const list = raw.split('\n').map(l => l.trim()).filter(l => l && !l.startsWith('<!--'));
      cacheByVol[vol] = list;
      return list;
    }
    return [];
  }

  function shuffle(arr) {
    const a = [...arr];
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  async function onVolChange() {
    document.getElementById('match-status').innerText = '正在载入章节列表...';
    const vol = document.getElementById('vol-select').value;
    const pool = await getChapters(vol);
    startTournament(pool);
  }

  function startTournament(pool) {
    if (!pool || pool.length < 2) {
      document.getElementById('match-status').innerText = '当前章节少于 2 篇，无法决选';
      return;
    }

    tournamentTree = [];
    roundMatches = [];
    currentRoundCandidates = shuffle(pool);
    nextRoundWinners = [];
    currentMatchIndex = 0;
    roundNumber = 1;
    finalChampionName = '';
    hasVotedThisGame = false;

    const recordBtn = document.getElementById('record-btn');
    recordBtn.disabled = false;
    recordBtn.innerText = '一键计入全站统计';
    recordBtn.style.background = 'var(--accent)';
    recordBtn.style.color = '#000';

    document.getElementById('winner-view').style.display = 'none';
    document.getElementById('game-view').style.display = 'block';

    renderMatch();
  }

  function renderMatch() {
    if (currentMatchIndex >= currentRoundCandidates.length) {
      tournamentTree.push(roundMatches);
      roundMatches = [];
      currentRoundCandidates = nextRoundWinners;
      nextRoundWinners = [];
      currentMatchIndex = 0;
      roundNumber++;
    }

    if (currentRoundCandidates.length === 1) {
      showChampion(currentRoundCandidates[0]);
      return;
    }

    if (currentMatchIndex === currentRoundCandidates.length - 1) {
      const bye = currentRoundCandidates[currentMatchIndex];
      nextRoundWinners.push(bye);
      roundMatches.push({ a: bye, b: '轮空', winner: bye, bye: true });
      currentMatchIndex++;
      renderMatch();
      return;
    }

    const itemA = currentRoundCandidates[currentMatchIndex];
    const itemB = currentRoundCandidates[currentMatchIndex + 1];

    document.getElementById('title-a').innerText = itemA;
    document.getElementById('title-b').innerText = itemB;

    const totalMatches = Math.ceil(currentRoundCandidates.length / 2);
    const currentMatch = Math.floor(currentMatchIndex / 2) + 1;
    document.getElementById('match-status').innerText = 
      `第 ${roundNumber} 轮 · 对决 (${currentMatch}/${totalMatches})`;
  }

  function pickWinner(index) {
    const itemA = currentRoundCandidates[currentMatchIndex];
    const itemB = currentRoundCandidates[currentMatchIndex + 1];
    const winner = index === 0 ? itemA : itemB;

    roundMatches.push({ a: itemA, b: itemB, winner: winner });
    nextRoundWinners.push(winner);
    currentMatchIndex += 2;
    renderMatch();
  }

  function showChampion(championName) {
    finalChampionName = championName;
    document.getElementById('game-view').style.display = 'none';
    document.getElementById('winner-view').style.display = 'block';
    document.getElementById('final-champion').innerText = championName;
    document.getElementById('upload-status').innerText = `已完成全部轮次决选！点击下方按钮将优胜计入全站热度榜`;
  }

  async function recordToGlobalLeaderboard() {
    if (!finalChampionName || hasVotedThisGame) return;

    const recordBtn = document.getElementById('record-btn');
    const statusTip = document.getElementById('upload-status');
    recordBtn.disabled = true;
    recordBtn.innerText = '正在计入全网...';

    localLeaderboard[finalChampionName] = (localLeaderboard[finalChampionName] || 0) + 1;
    localStorage.setItem('daohou_local_stats', JSON.stringify(localLeaderboard));

    try {
      const key = encodeURIComponent(finalChampionName).replace(/%/g, '_');
      const res = await fetch(`https://api.counterapi.dev/v1/${NAMESPACE}/${key}/up`);
      if (res.ok) {
        const data = await res.json();
        statusTip.innerText = `计票成功！《${finalChampionName}》全站总胜场累积至 ${data.count} 次`;
      } else {
        statusTip.innerText = `计票成功！《${finalChampionName}》已计入全站热度库`;
      }
    } catch (e) {
      statusTip.innerText = `计票成功！《${finalChampionName}》已计入全站热度库`;
    }

    hasVotedThisGame = true;
    recordBtn.innerText = '已成功计入全站';
    recordBtn.style.background = '#27314a';
    recordBtn.style.color = '#94a3b8';
  }

  async function openStatsModal() {
    document.getElementById('stats-modal').classList.add('show');
    document.getElementById('stats-loading').style.display = 'block';
    document.getElementById('stats-table').style.display = 'none';

    let counts = { ...localLeaderboard };

    document.getElementById('stats-loading').style.display = 'none';
    const tbody = document.getElementById('stats-tbody');
    tbody.innerHTML = '';

    const entries = Object.entries(counts);
    if (entries.length === 0) {
      tbody.innerHTML = `<tr><td colspan="3" style="text-align:center; color: var(--text-secondary); padding: 24px;">暂无读者计票，快在决选后点击“一键计入全站统计”投出第一票吧！</td></tr>`;
      document.getElementById('stats-table').style.display = 'table';
      return;
    }

    entries.sort((a, b) => b[1] - a[1]);

    entries.forEach(([title, votes], idx) => {
      const tr = document.createElement('tr');
      const rankClass = idx === 0 ? 'rank-1' : idx === 1 ? 'rank-2' : idx === 2 ? 'rank-3' : '';
      tr.innerHTML = `
        <td><span class="rank-tag ${rankClass}">${idx + 1}</span></td>
        <td style="color: #fff; font-weight: ${idx < 3 ? '600' : 'normal'}">${title}</td>
        <td style="color: var(--accent); font-weight: 700;">${votes} 次</td>
      `;
      tbody.appendChild(tr);
    });

    document.getElementById('stats-table').style.display = 'table';
  }

  function openTreeModal() {
    const container = document.getElementById('tree-container');
    container.innerHTML = '';

    tournamentTree.forEach((round, rIndex) => {
      const roundEl = document.createElement('div');
      roundEl.className = 'tree-round';

      const isFinal = rIndex === tournamentTree.length - 1;
      const isSemi = rIndex === tournamentTree.length - 2;
      let title = `第 ${rIndex + 1} 轮`;
      if (isFinal) title = '决赛';
      else if (isSemi && tournamentTree.length > 2) title = '半决赛';

      roundEl.innerHTML = `<div class="tree-round-header">${title}</div>`;

      const matchesEl = document.createElement('div');
      matchesEl.className = 'tree-matches';

      round.forEach(m => {
        const matchNode = document.createElement('div');
        matchNode.className = 'match-node';

        const itemAClass = m.winner === m.a ? 'node-item winner' : 'node-item';
        const itemBClass = m.winner === m.b ? 'node-item winner' : 'node-item';

        matchNode.innerHTML = `
          <div class="${itemAClass}" title="${m.a}">${m.a}</div>
          <div class="${itemBClass}" title="${m.b}">${m.b}</div>
        `;
        matchesEl.appendChild(matchNode);
      });

      roundEl.appendChild(matchesEl);
      container.appendChild(roundEl);
    });

    document.getElementById('tree-modal').classList.add('show');
  }

  function closeModal(id) { document.getElementById(id).classList.remove('show'); }
  function onModalBgClick(e, id) { if (e.target.id === id) closeModal(id); }
  function restart() { onVolChange(); }

  function exportTreeAsImage() {
    if (!tournamentTree || tournamentTree.length === 0) return;

    const colWidth = 240;
    const colGap = 40;
    const cardHeight = 68;
    const paddingX = 40;
    const paddingTop = 120;
    const paddingBottom = 40;

    let maxMatchesInRound = 1;
    tournamentTree.forEach(r => {
      if (r.length > maxMatchesInRound) maxMatchesInRound = r.length;
    });

    const totalWidth = paddingX * 2 + tournamentTree.length * colWidth + (tournamentTree.length - 1) * colGap;
    const availableHeight = Math.max(maxMatchesInRound * 85, 480);
    const totalHeight = paddingTop + availableHeight + paddingBottom;

    const canvas = document.createElement('canvas');
    const dpr = window.devicePixelRatio || 2;
    canvas.width = totalWidth * dpr;
    canvas.height = totalHeight * dpr;
    const ctx = canvas.getContext('2d');
    ctx.scale(dpr, dpr);

    ctx.fillStyle = '#0d0f18';
    ctx.fillRect(0, 0, totalWidth, totalHeight);
    ctx.strokeStyle = '#27314a';
    ctx.
