<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>道猴章名决选</title>
<style>
  :root {
    --bg-color: #0b0d14;
    --card-bg: #141824;
    --card-hover: #1c2236;
    --border-color: #252e45;
    --accent: #d4af37;
    --accent-hover: #f1c40f;
    --text-primary: #f8fafc;
    --text-secondary: #94a3b8;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
    background-color: var(--bg-color);
    color: var(--text-primary);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 30px 16px;
  }

  .container { width: 100%; max-width: 920px; text-align: center; }
  
  header { margin-bottom: 1.8rem; }
  h1 { font-size: 2.2rem; color: var(--accent); letter-spacing: 2px; margin-bottom: 0.5rem; }
  .subtitle { color: var(--text-secondary); font-size: 0.95rem; }

  .toolbar {
    margin-bottom: 2rem;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
  }

  .vol-select {
    background: var(--card-bg);
    color: var(--text-primary);
    border: 1px solid var(--accent);
    padding: 9px 18px;
    border-radius: 6px;
    font-size: 0.95rem;
    outline: none;
    cursor: pointer;
  }
  .vol-select option { background: #11141d; }

  .match-status {
    margin-bottom: 1.5rem;
    font-weight: 600;
    color: var(--accent);
    letter-spacing: 1px;
    font-size: 1.1rem;
    min-height: 1.6em;
  }

  .arena {
    display: flex;
    gap: 24px;
    justify-content: center;
    align-items: stretch;
    position: relative;
    min-height: 240px;
  }

  .vs-badge {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    background: var(--accent);
    color: #000;
    font-weight: 800;
    font-size: 0.85rem;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 2;
    pointer-events: none;
    box-shadow: 0 0 15px rgba(212, 175, 55, 0.4);
  }

  .card-option {
    flex: 1;
    background: var(--card-bg);
    border: 2px solid var(--border-color);
    border-radius: 12px;
    padding: 2.8rem 1.8rem;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    box-shadow: 0 4px 16px rgba(0, 0, 0, 0.3);
  }

  .card-option:hover {
    transform: translateY(-4px);
    border-color: var(--accent);
    background: var(--card-hover);
    box-shadow: 0 8px 25px rgba(212, 175, 55, 0.2);
  }

  .card-title {
    font-size: 1.35rem;
    font-weight: 600;
    line-height: 1.5;
    color: #fff;
    word-break: break-word;
  }

  .winner-box {
    display: none;
    background: var(--card-bg);
    border: 2px solid var(--accent);
    border-radius: 14px;
    padding: 3rem 2rem;
    animation: fadeIn 0.4s ease;
    box-shadow: 0 0 30px rgba(212, 175, 55, 0.15);
  }

  .winner-label {
    color: var(--text-secondary);
    font-size: 0.95rem;
    letter-spacing: 2px;
    text-transform: uppercase;
  }

  .winner-name {
    font-size: 2.4rem;
    color: var(--accent);
    font-weight: 700;
    margin: 1.2rem 0;
  }

  .upload-tip {
    font-size: 0.95rem;
    color: var(--text-secondary);
    margin-bottom: 1.2rem;
    min-height: 1.5em;
  }

  .btn-group {
    display: flex;
    justify-content: center;
    gap: 12px;
    margin-top: 1.8rem;
    flex-wrap: wrap;
  }

  .btn {
    padding: 9px 20px;
    background: var(--accent);
    color: #000;
    font-weight: 600;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    font-size: 0.95rem;
    transition: all 0.2s;
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }
  .btn:hover { background: var(--accent-hover); }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }

  .btn-secondary { background: #252e45; color: #f8fafc; border: 1px solid var(--border-color); }
  .btn-secondary:hover { background: #334155; }
  .btn-danger { background: #7f1d1d; color: #fecaca; border: 1px solid #991b1b; }
  .btn-danger:hover { background: #991b1b; }

  /* 弹窗样式 */
  .modal {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.85);
    z-index: 1000;
    align-items: center;
    justify-content: center;
    padding: 20px;
    backdrop-filter: blur(5px);
  }
  .modal.show { display: flex; }

  .modal-card {
    background: #141824;
    border: 1px solid var(--border-color);
    border-radius: 12px;
    width: 100%;
    max-width: 960px;
    max-height: 85vh;
    display: flex;
    flex-direction: column;
    padding: 24px;
  }

  .modal-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid var(--border-color);
    padding-bottom: 12px;
    margin-bottom: 16px;
  }

  .modal-header-actions { display: flex; align-items: center; gap: 12px; }
  .modal-title { color: var(--accent); font-size: 1.25rem; font-weight: 600; }

  .tab-group {
    display: flex;
    gap: 8px;
    background: #0b0d14;
    padding: 4px;
    border-radius: 8px;
    border: 1px solid var(--border-color);
  }
  .tab-btn {
    padding: 6px 14px;
    border: none;
    background: transparent;
    color: var(--text-secondary);
    cursor: pointer;
    border-radius: 6px;
    font-size: 0.85rem;
    font-weight: 600;
    transition: all 0.2s;
  }
  .tab-btn.active {
    background: var(--accent);
    color: #000;
  }

  .close-btn {
    background: transparent;
    border: none;
    color: var(--text-secondary);
    font-size: 1.6rem;
    cursor: pointer;
    line-height: 1;
  }
  .close-btn:hover { color: #fff; }

  .modal-body { overflow: auto; flex: 1; text-align: left; }

  .modal-footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-top: 1px solid var(--border-color);
    padding-top: 14px;
    margin-top: 14px;
  }

  .tree-container { display: flex; gap: 20px; padding: 10px 4px; min-width: max-content; }
  .tree-round { min-width: 220px; display: flex; flex-direction: column; }
  .tree-round-header {
    font-size: 0.85rem; font-weight: 600; color: var(--text-secondary);
    margin-bottom: 12px; text-align: center; padding-bottom: 6px;
    border-bottom: 1px solid var(--border-color);
  }

  .tree-matches { display: flex; flex-direction: column; justify-content: space-around; flex: 1; gap: 12px; }
  .match-node {
    background: #1a2030; border: 1px solid var(--border-color);
    border-radius: 6px; padding: 8px 10px; display: flex; flex-direction: column; gap: 4px;
  }
  .node-item {
    font-size: 0.85rem; padding: 4px 6px; border-radius: 4px; color: #64748b;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .node-item.winner {
    color: #f8fafc; background: rgba(212, 175, 55, 0.15); font-weight: 600;
    border-left: 3px solid var(--accent);
  }

  .stats-table { width: 100%; border-collapse: collapse; font-size: 0.95rem; }
  .stats-table th, .stats-table td { padding: 12px 16px; text-align: left; border-bottom: 1px solid var(--border-color); }
  .stats-table th { color: var(--text-secondary); font-weight: 600; }

  .rank-tag {
    display: inline-block; width: 26px; height: 26px; line-height: 26px;
    text-align: center; border-radius: 50%; font-weight: 700; font-size: 0.85rem;
    background: #252e45; color: #fff;
  }
  .rank-1 { background: #d4af37; color: #000; }
  .rank-2 { background: #94a3b8; color: #000; }
  .rank-3 { background: #b45309; color: #fff; }

  @keyframes fadeIn {
    from { opacity: 0; transform: scale(0.98); }
    to { opacity: 1; transform: scale(1); }
  }

  @media (max-width: 640px) {
    .arena { flex-direction: column; }
    .vs-badge { display: none; }
    .modal-card { padding: 16px; }
    .tab-group { width: 100%; margin-top: 8px; }
  }
</style>
</head>
<body>

<div class="container">
<header>
  <h1>道猴章名决选</h1>
  <p class="subtitle">遵从直觉，选出你心目中最具神韵的章节名</p>
</header>

<div class="toolbar">
  <label for="vol-select" style="color: var(--text-secondary); font-size: 0.95rem;">决选范围：</label>
  <select id="vol-select" class="vol-select" onchange="onVolChange()">
    <option value="1">第一卷 (13章)</option>
    <option value="2">第二卷 (21章)</option>
    <option value="3">第三卷 (32章)</option>
    <option value="4">第四卷 (42章)</option>
    <option value="5">第五卷 (51章)</option>
    <option value="6">第六卷 (63章)</option>
    <option value="7">第七卷 (70章)</option>
    <option value="all">全卷巅峰大乱斗 (共266章)</option>
  </select>
  <button class="btn btn-secondary" onclick="openStatsModal()">查看天梯排行榜</button>
</div>

<!-- 对决界面 -->
<div id="game-view">
  <div class="match-status" id="match-status">准备就绪</div>
  <div class="arena">
    <div class="vs-badge">VS</div>
    <div class="card-option" onclick="pickWinner(0)">
      <div class="card-title" id="title-a"></div>
    </div>
    <div class="card-option" onclick="pickWinner(1)">
      <div class="card-title" id="title-b"></div>
    </div>
  </div>
</div>

<!-- 优胜结算界面 -->
<div id="winner-view" class="winner-box">
  <div class="winner-label">最终裁定章名</div>
  <div class="winner-name" id="final-champion"></div>
  <div class="upload-tip" id="upload-status">已决选出该卷桂冠</div>

  <div class="btn-group">
    <button class="btn" onclick="restart()">重新洗牌决选</button>
    <button class="btn btn-secondary" onclick="openTreeModal()">查看决选路线图</button>
    <button class="btn btn-secondary" onclick="openStatsModal()">查看天梯排行榜</button>
    <button class="btn" id="record-btn" onclick="recordToGlobalLeaderboard()">一键计入全站统计</button>
  </div>
</div>
</div>

<!-- 路线图弹窗 -->
<div class="modal" id="tree-modal" onclick="onModalBgClick(event, 'tree-modal')">
<div class="modal-card">
  <div class="modal-header">
    <div class="modal-title">决选晋级路线图</div>
    <div class="modal-header-actions">
      <button class="btn" style="padding: 6px 14px; font-size: 0.85rem;" onclick="exportTreeAsImage()">导出高清大图</button>
      <button class="close-btn" onclick="closeModal('tree-modal')">&times;</button>
    </div>
  </div>
  <div class="modal-body">
    <div class="tree-container" id="tree-container"></div>
  </div>
</div>
</div>

<!-- 双天梯排行榜弹窗 -->
<div class="modal" id="stats-modal" onclick="onModalBgClick(event, 'stats-modal')">
<div class="modal-card">
  <div class="modal-header" style="flex-wrap: wrap; gap: 10px;">
    <div style="display: flex; align-items: center; gap: 14px;">
      <div class="modal-title">读者天梯排行榜</div>
      <div class="tab-group">
        <button class="tab-btn active" id="tab-champ" onclick="switchTab('champion')">桂冠夺冠榜</button>
        <button class="tab-btn" id="tab-fav" onclick="switchTab('favorite')">综合喜爱度榜 (胜率与胜场)</button>
      </div>
    </div>
    <button class="close-btn" onclick="closeModal('stats-modal')">&times;</button>
  </div>
  <div class="modal-body">
    <table class="stats-table" id="stats-table">
      <thead id="stats-thead"></thead>
      <tbody id="stats-tbody"></tbody>
    </table>
  </div>
  <div class="modal-footer">
    <span style="font-size: 0.8rem; color: var(--text-secondary);">数据持续累计中 · 每次对决与夺冠均参与计算</span>
    <button class="btn btn-danger" style="font-size: 0.8rem; padding: 6px 12px;" onclick="clearAllData()">清空重置榜单数据</button>
  </div>
</div>
</div>

let currentRoundCandidates = [];
let nextRoundWinners = [];
let currentMatchIndex = 0;
let roundNumber = 1;
let finalChampionName = '';
let tournamentTree = [];
let roundMatches = [];
let hasVotedThisGame = false;
let currentTab = 'champion';

// 本地持久化数据：包含冠军胜场与每一战的细分数据
// 结构: { champions: { title: count }, matches: { title: { win: 0, total: 0 } } }
let statsStore = JSON.parse(localStorage.getItem('daohou_stats_store') || 'null');
if (!statsStore) {
  // 兼容旧版格式
  const oldLocal = JSON.parse(localStorage.getItem('daohou_local_stats') || '{}');
  statsStore = { champions: oldLocal, matches: {} };
}

function getChaptersForVol(vol) {
  if (vol === 'all') {
    let all = [];
    for (let i = 1; i <= 7; i++) {
      all = all.concat(CHAPTERS_BY_VOL[String(i)] || []);
    }
    return all;
  }
  return CHAPTERS_BY_VOL[vol] || [];
}

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function onVolChange() {
  const vol = document.getElementById('vol-select').value;
  const pool = getChaptersForVol(vol);
  startTournament(pool);
}

function startTournament(pool) {
  tournamentTree = [];
  roundMatches = [];
  currentRoundCandidates = shuffle(pool);
  nextRoundWinners = [];
  currentMatchIndex = 0;
  roundNumber = 1;
  finalChampionName = '';
  hasVotedThisGame = false;

  const recordBtn = document.getElementById('record-btn');
  recordBtn.disabled = false;
  recordBtn.innerText = '一键计入全站统计';
  recordBtn.style.background = 'var(--accent)';
  recordBtn.style.color = '#000';

  document.getElementById('winner-view').style.display = 'none';
  document.getElementById('game-view').style.display = 'block';

  renderMatch();
}

function renderMatch() {
  if (currentMatchIndex >= currentRoundCandidates.length) {
    tournamentTree.push(roundMatches);
    roundMatches = [];
    currentRoundCandidates = nextRoundWinners;
    nextRoundWinners = [];
    currentMatchIndex = 0;
    roundNumber++;
  }

  if (currentRoundCandidates.length === 1) {
    showChampion(currentRoundCandidates[0]);
    return;
  }

  if (currentMatchIndex === currentRoundCandidates.length - 1) {
    const bye = currentRoundCandidates[currentMatchIndex];
    nextRoundWinners.push(bye);
    roundMatches.push({ a: bye, b: '轮空', winner: bye, bye: true });
    currentMatchIndex++;
    renderMatch();
    return;
  }

  const itemA = currentRoundCandidates[currentMatchIndex];
  const itemB = currentRoundCandidates[currentMatchIndex + 1];

  document.getElementById('title-a').innerText = itemA;
  document.getElementById('title-b').innerText = itemB;

  const totalMatches = Math.ceil(currentRoundCandidates.length / 2);
  const currentMatch = Math.floor(currentMatchIndex / 2) + 1;
  document.getElementById('match-status').innerText = 
    `第 ${roundNumber} 轮 · 对决 (${currentMatch}/${totalMatches})`;
}

function pickWinner(index) {
  const itemA = currentRoundCandidates[currentMatchIndex];
  const itemB = currentRoundCandidates[currentMatchIndex + 1];
  const winner = index === 0 ? itemA : itemB;
  const loser = index === 0 ? itemB : itemA;

  // 实时累计喜爱度战绩（每场胜负均被忠实记录）
  if (!statsStore.matches[winner]) statsStore.matches[winner] = { win: 0, total: 0 };
  if (!statsStore.matches[loser]) statsStore.matches[loser] = { win: 0, total: 0 };
  statsStore.matches[winner].win += 1;
  statsStore.matches[winner].total += 1;
  statsStore.matches[loser].total += 1;
  localStorage.setItem('daohou_stats_store', JSON.stringify(statsStore));

  roundMatches.push({ a: itemA, b: itemB, winner: winner });
  nextRoundWinners.push(winner);
  currentMatchIndex += 2;
  renderMatch();
}

function showChampion(championName) {
  finalChampionName = championName;
  document.getElementById('game-view').style.display = 'none';
  document.getElementById('winner-view').style.display = 'block';
  document.getElementById('final-champion').innerText = championName;
  document.getElementById('upload-status').innerText = `全部对决完成！点击下方按钮将结果计入全网总热度榜`;
}

async function recordToGlobalLeaderboard() {
  if (!finalChampionName || hasVotedThisGame) return;

  const recordBtn = document.getElementById('record-btn');
  const statusTip = document.getElementById('upload-status');
  recordBtn.disabled = true;
  recordBtn.innerText = '正在计入全网...';

  // 增加冠军胜场计数
  statsStore.champions[finalChampionName] = (statsStore.champions[finalChampionName] || 0) + 1;
  localStorage.setItem('daohou_stats_store', JSON.stringify(statsStore));

  try {
    const key = encodeURIComponent(finalChampionName).replace(/%/g, '_');
    const res = await fetch(`https://api.counterapi.dev/v1/${NAMESPACEv2}/${key}/up`);
    if (res.ok) {
      const data = await res.json();
      statusTip.innerText = `计票成功！《${finalChampionName}》夺冠总场次已达 ${data.count} 次`;
    } else {
      statusTip.innerText = `计票成功！《${finalChampionName}》已计入全网喜爱度库`;
    }
  } catch (e) {
    statusTip.innerText = `计票成功！《${finalChampionName}》已计入全网喜爱度库`;
  }

  hasVotedThisGame = true;
  recordBtn.innerText = '已成功计入全网';
  recordBtn.style.background = '#252e45';
  recordBtn.style.color = '#94a3b8';
}

function switchTab(type) {
  currentTab = type;
  document.getElementById('tab-champ').classList.toggle('active', type === 'champion');
  document.getElementById('tab-fav').classList.toggle('active', type === 'favorite');
  renderStatsTable();
}

function openStatsModal() {
  document.getElementById('stats-modal').classList.add('show');
  renderStatsTable();
}

function renderStatsTable() {
  const thead = document.getElementById('stats-thead');
  const tbody = document.getElementById('stats-tbody');
  tbody.innerHTML = '';

  if (currentTab === 'champion') {
    // 1. 桂冠榜
    thead.innerHTML = `
      <tr>
        <th style="width: 70px;">排名</th>
        <th>章节名</th>
        <th style="width: 130px; text-align: right;">夺冠总次数</th>
      </tr>
    `;

    const entries = Object.entries(statsStore.champions || {});
    if (entries.length === 0) {
      tbody.innerHTML = `<tr><td colspan="3" style="text-align:center; color: var(--text-secondary); padding: 28px;">暂无夺冠记录，完成决选并点击“一键计入全站统计”将产生第一位冠军！</td></tr>`;
      return;
    }

    entries.sort((a, b) => b[1] - a[1]);

    entries.forEach(([title, count], idx) => {
      const tr = document.createElement('tr');
      const rankClass = idx === 0 ? 'rank-1' : idx === 1 ? 'rank-2' : idx === 2 ? 'rank-3' : '';
      tr.innerHTML = `
        <td><span class="rank-tag ${rankClass}">${idx + 1}</span></td>
        <td style="color: #fff; font-weight: ${idx < 3 ? '600' : 'normal'}">${title}</td>
        <td style="color: var(--accent); font-weight: 700; text-align: right;">${count} 次</td>
      `;
      tbody.appendChild(tr);
    });

  } else {
    // 2. 综合喜爱度榜（特殊加权算法：胜场权重 + 胜率加成）
    thead.innerHTML = `
      <tr>
        <th style="width: 70px;">排名</th>
        <th>章节名</th>
        <th style="width: 100px; text-align: center;">胜/负/总场</th>
        <th style="width: 90px; text-align: center;">对决胜率</th>
        <th style="width: 100px; text-align: right;">喜爱度积分</th>
      </tr>
    `;

    const matchEntries = Object.entries(statsStore.matches || {});
    if (matchEntries.length === 0) {
      tbody.innerHTML = `<tr><td colspan="5" style="text-align:center; color: var(--text-secondary); padding: 28px;">暂无对决数据，参与几次两两抉择后即可生成积分！</td></tr>`;
      return;
    }

    // 计算喜爱度积分公式: 胜场 * 10 + 胜率 * 100
    const list = matchEntries.map(([title, st]) => {
      const winRate = st.total > 0 ? (st.win / st.total) : 0;
      const score = Math.round(st.win * 10 + winRate * 100);
      return {
        title,
        win: st.win,
        loss: st.total - st.win,
        total: st.total,
        winRate: (winRate * 100).toFixed(1),
        score: score
      };
    });

    list.sort((a, b) => b.score - a.score || b.win - a.win);

    list.forEach((item, idx) => {
      const tr = document.createElement('tr');
      const rankClass = idx === 0 ? 'rank-1' : idx === 1 ? 'rank-2' : idx === 2 ? 'rank-3' : '';
      tr.innerHTML = `
        <td><span class="rank-tag ${rankClass}">${idx + 1}</span></td>
        <td style="color: #fff; font-weight: ${idx < 3 ? '600' : 'normal'}">${item.title}</td>
        <td style="color: var(--text-secondary); font-size: 0.85rem; text-align: center;">${item.win}胜 / ${item.loss}负</td>
        <td style="color: #e2e8f0; font-weight: 600; text-align: center;">${item.winRate}%</td>
        <td style="color: var(--accent); font-weight: 700; text-align: right;">${item.score} pt</td>
      `;
      tbody.appendChild(tr);
    });
  }
}

function clearAllData() {
  if (confirm('确定要清空全部的对决战绩与夺冠排行榜吗？此操作无法撤销。')) {
    statsStore = { champions: {}, matches: {} };
    localStorage.removeItem('daohou_stats_store');
    localStorage.removeItem('daohou_local_stats');
    renderStatsTable();
    alert('榜单数据已成功清空归零！');
  }
}

function openTreeModal() {
  const container = document.getElementById('tree-container');
  container.innerHTML = '';

  tournamentTree.forEach((round, rIndex) => {
    const roundEl = document.createElement('div');
    roundEl.className = 'tree-round';

    const isFinal = rIndex === tournamentTree.length - 1;
    const isSemi = rIndex === tournamentTree.length - 2;
    let title = `第 ${rIndex + 1} 轮`;
    if (isFinal) title = '决赛';
    else if (isSemi && tournamentTree.length > 2) title = '半决赛';

    roundEl.innerHTML = `<div class="tree-round-header">${title}</div>`;

    const matchesEl = document.createElement('div');
    matchesEl.className = 'tree-matches';

    round.forEach(m => {
      const matchNode = document.createElement('div');
      matchNode.className = 'match-node';

      const itemAClass = m.winner === m.a ? 'node-item winner' : 'node-item';
      const itemBClass = m.winner === m.b ? 'node-item winner' : 'node-item';

      matchNode.innerHTML = `
        <div class="${itemAClass}" title="${m.a}">${m.a}</div>
        <div class="${itemBClass}" title="${m.b}">${m.b}</div>
      `;
      matchesEl.appendChild(matchNode);
    });

    roundEl.appendChild(matchesEl);
    container.appendChild(roundEl);
  });

  document.getElementById('tree-modal').classList.add('show');
}

function closeModal(id) { document.getElementById(id).classList.remove('show'); }
function onModalBgClick(e, id) { if (e.target.id === id) closeModal(id); }
function restart() { onVolChange(); }

function exportTreeAsImage() {
  if (!tournamentTree || tournamentTree.length === 0) return;

  const colWidth = 240;
  const colGap = 40;
  const cardHeight = 68;
  const paddingX = 40;
  const paddingTop = 120;
  const paddingBottom = 40;

  let maxMatchesInRound = 1;
  tournamentTree.forEach(r => {
    if (r.length > maxMatchesInRound) maxMatchesInRound = r.length;
  });

  const totalWidth = paddingX * 2 + tournamentTree.length * colWidth + (tournamentTree.length - 1) * colGap;
  const availableHeight = Math.max(maxMatchesInRound * 85, 480);
  const totalHeight = paddingTop + availableHeight + paddingBottom;

  const canvas = document.createElement('canvas');
  const dpr = window.devicePixelRatio || 2;
  canvas.width = totalWidth * dpr;
  canvas.height = totalHeight * dpr;
  const ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);

  ctx.fillStyle = '#0b0d14';
  ctx.fillRect(0, 0, totalWidth, totalHeight);
  ctx.strokeStyle = '#252e45';
  ctx.lineWidth = 2;
  ctx.strokeRect(10, 10, totalWidth - 20, totalHeight - 20);

  const volSelect = document.getElementById('vol-select');
  const volText = volSelect.options[volSelect.selectedIndex].text;
  ctx.fillStyle = '#d4af37';
  ctx.font = 'bold 24px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Microsoft YaHei"';
  ctx.textAlign = 'left';
  ctx.fillText('道猴章名竞赛 · 决选晋级路线图', paddingX, 48);

  ctx.fillStyle = '#94a3b8';
  ctx.font = '14px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Microsoft YaHei"';
  ctx.fillText(`决选范围: ${volText}   |   最终裁定章名: ${finalChampionName || '未完成'}`, paddingX, 76);

  ctx.strokeStyle = '#1c2236';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(paddingX, 94);
  ctx.lineTo(totalWidth - paddingX, 94);
  ctx.stroke();

  tournamentTree.forEach((round, colIndex) => {
    const x = paddingX + colIndex * (colWidth + colGap);
    const matchCount = round.length;
    const slotHeight = availableHeight / matchCount;

    const isFinal = colIndex === tournamentTree.length - 1;
    const isSemi = colIndex === tournamentTree.length - 2;
    let roundTitle = `第 ${colIndex + 1} 轮`;
    if (isFinal) roundTitle = '决赛';
    else if (isSemi && tournamentTree.length > 2) roundTitle = '半决赛';

    ctx.fillStyle = '#94a3b8';
    ctx.font = 'bold 13px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Microsoft YaHei"';
    ctx.textAlign = 'center';
    ctx.fillText(roundTitle, x + colWidth / 2, paddingTop - 12);

    round.forEach((m, mIndex) => {
      const y = paddingTop + mIndex * slotHeight + (slotHeight - cardHeight) / 2;

      ctx.fillStyle = '#141824';
      ctx.beginPath();
      ctx.roundRect(x, y, colWidth, cardHeight, 6);
      ctx.fill();
      ctx.strokeStyle = '#252e45';
      ctx.lineWidth = 1;
      ctx.stroke();

      drawNodeItem(ctx, x + 6, y + 6, colWidth - 12, 26, m.a, m.winner === m.a);
      drawNodeItem(ctx, x + 6, y + 36, colWidth - 12, 26, m.b, m.winner === m.b);
    });
  });

  const link = document.createElement('a');
  link.download = `道猴章名决选路线图_${Date.now()}.png`;
  link.href = canvas.toDataURL('image/png');
  link.click();
}

function drawNodeItem(ctx, x, y, w, h, text, isWinner) {
  if (isWinner) {
    ctx.fillStyle = 'rgba(212, 175, 55, 0.16)';
    ctx.beginPath();
    ctx.roundRect(x, y, w, h, 4);
    ctx.fill();
    ctx.fillStyle = '#d4af37';
    ctx.fillRect(x, y, 3, h);
    ctx.fillStyle = '#f8fafc';
    ctx.font = 'bold 12px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Microsoft YaHei"';
  } else {
    ctx.fillStyle = '#64748b';
    ctx.font = '12px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Microsoft YaHei"';
  }

  ctx.textAlign = 'left';
  ctx.textBaseline = 'middle';

  let displayText = text;
  while (ctx.measureText(displayText).width > w - 16 && displayText.length > 1) {
    displayText = displayText.slice(0, -1);
  }
  if (displayText !== text) displayText += '...';

  ctx.fillText(displayText, x + 8, y + h / 2);
}
